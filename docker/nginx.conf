# nginx in front of the Flask app:
#  * serves stored blobs/tarballs/wheels directly from disk via X-Accel-Redirect (sendfile, range requests)
#  * streams uploads (docker layers) to the app without buffering them
#  * serves static assets
worker_processes auto;
events { worker_connections 8192; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75s;
    server_tokens off;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    # re-resolved at runtime: a recreated or scaled web container gets new IPs (no 502 until nginx restarts)
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    upstream app {
        zone app 64k;
        server web:8080 resolve;
        keepalive 128;
    }

    # keep the scheme of an outer TLS-terminating proxy, if any
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 8080;
        listen [::]:8080;                 # removed at start-up when the container has no IPv6 (docker/nginx-ipv6.sh)

        client_max_body_size    0;        # docker layers can be many GB
        client_body_timeout     900s;
        proxy_request_buffering off;      # stream uploads straight to the app
        proxy_buffering         off;      # stream proxy cache misses directly to the client
        proxy_read_timeout      900s;
        proxy_send_timeout      900s;
        proxy_http_version      1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        location /static/ {
            alias /usr/share/nginx/static/;
            expires 1d;
            access_log off;
        }

        # Internal: the app answers downloads with "X-Accel-Redirect: /_storage/<path>"
        location /_storage/ {
            internal;
            alias /data/storage/;
            # custom upstream headers are not copied on internal redirects -> re-add them
            add_header Docker-Content-Digest           $upstream_http_docker_content_digest always;
            add_header Docker-Distribution-API-Version $upstream_http_docker_distribution_api_version always;
        }

        # Internal (STORAGE_BACKEND=s3 with S3_SERVE=proxy): the app answers with
        # "X-Accel-Redirect: /_s3/<scheme>/<host[:port]>/<path>?<pre-signed query>" and nginx streams the object
        # from the object store – clients only ever talk to Florepo.
        location ~ ^/_s3/(?<s3_scheme>https?)/(?<s3_hostname>[^/:]+)(?<s3_port>:[0-9]+)?/(?<s3_path>.*)$ {
            internal;
            # evaluated before proxy_pass replaces the upstream: keep the app's registry headers
            set $s3_digest $upstream_http_docker_content_digest;
            set $s3_api    $upstream_http_docker_distribution_api_version;
            resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
            proxy_pass $s3_scheme://$s3_hostname$s3_port/$s3_path$is_args$args;
            proxy_set_header Host $s3_hostname$s3_port;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_ssl_server_name on;
            proxy_ssl_name $s3_hostname;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-version-id;
            proxy_hide_header x-amz-server-side-encryption;
            proxy_hide_header Set-Cookie;
            add_header Docker-Content-Digest           $s3_digest always;
            add_header Docker-Distribution-API-Version $s3_api always;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
